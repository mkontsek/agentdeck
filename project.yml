name: AgentDeck
options:
  bundleIdPrefix: io.kontsek
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
targets:
  AgentDeck:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
    dependencies:
      - package: SwiftTerm
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: AgentDeck
        CFBundleDisplayName: AgentDeck
        CFBundleShortVersionString: "0.1.12"
        CFBundleVersion: "0.1.12"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kontsek.agentdeck
        PRODUCT_NAME: AgentDeck
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "0.1.12"
        CURRENT_PROJECT_VERSION: "0.1.12"
        COMBINE_HIDPI_IMAGES: true
  AgentDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Models
      - path: Sources/Services
      - path: Sources/MCP
      - path: Sources/Store
      - path: Sources/Terminal/TerminalHost.swift
      - path: Sources/Terminal/TerminalPaneView.swift
      - path: Sources/Browser/BrowserHost.swift
      - path: Sources/Browser/BrowserDownload.swift
      - path: Sources/Browser/BrowserPaneView.swift
      - path: Sources/Browser/BrowserAutomation.swift
      - path: Sources/Browser/BrowserScripts.swift
      - path: Sources/Views/PaneFocusOverlay.swift
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
schemes:
  AgentDeck:
    build:
      targets:
        AgentDeck: all
    test:
      targets:
        - AgentDeckTests
